[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "data-health-check"
version = "0.1.0"
description = "Profile CSV and Excel files (types, completeness, sensitive data labels) in a web app or as an MCP tool."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saltbridge Systems LLC", email = "svc-github@saltbridgesystems.com" }]
requires-python = ">=3.11,<3.13"
keywords = ["data-profiling", "data-quality", "pii-detection", "csv", "excel", "mcp", "streamlit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Exact pins: this is an application. Dependabot proposes upgrades.
dependencies = [
    "dataprofiler==0.14.0",
    "mcp==2.3.0",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "psutil==7.2.2",
    "streamlit==1.65.0",
    # DataProfiler's "ml" extra requires the full `tensorflow` distribution, so
    # the labeler's needs are listed here instead. tensorflow-cpu is about half
    # the download on Linux x86-64 and is identical on Windows; macOS and
    # Linux ARM only have `tensorflow` wheels (CPU-only there anyway). There are
    # no wheels for Intel Macs or Windows on ARM: those get Lite mode only.
    "tensorflow-cpu==2.21.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine != 'ARM64')",
    "tensorflow==2.21.0; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'aarch64')",
    "keras==3.15.1",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[project.urls]
Homepage = "https://github.com/SSi0/data-health-check"
Repository = "https://github.com/SSi0/data-health-check"
Issues = "https://github.com/SSi0/data-health-check/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/data_health_check"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "full_mode: runs DataProfiler's TensorFlow data labeler (slow; deselect with -m 'not full_mode')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
